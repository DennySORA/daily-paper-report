name: Build and publish reviewed release

# Only the release branch publishes an already prepared, reviewed packet.
# Main, tags, PRs, schedules and manual dispatch cannot trigger publication.
on:
  push:
    branches: [release]

permissions:
  contents: read

concurrency:
  group: reviewed-paper-release
  cancel-in-progress: false

jobs:
  verify:
    name: Validate prepared data and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release branch and immutable public payload
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: >-
          python3 scripts/release-prepared.py validate
          --release-dir prepared-release --ref-name "$RELEASE_REF"
          --event "$GITHUB_EVENT_NAME" --ref-type "$GITHUB_REF_TYPE"
      - name: Test deterministic release guards
        run: python3 -m unittest discover -s tests/release -p 'test_*.py' -v
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run verify
        working-directory: frontend
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-shell
          path: frontend/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish reviewed data and shell
    needs: verify
    if: github.repository == 'DennySORA/daily-paper-report' && github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - name: Check the existing Pages source without changing settings
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPOSITORY}/pages" --jq \
            '.build_type == "legacy" and .source.branch == "gh-pages" and .source.path == "/" and .cname == "paper.dennysora.me"' \
            | grep -qx true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: site
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-shell
          path: source/frontend/dist
      - name: Stage only validated data and built shell
        env:
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 source/scripts/release-prepared.py stage \
            --release-dir source/prepared-release --site-dir site \
            --shell-dir source/frontend/dist --ref-name "$RELEASE_REF" \
            --event "$GITHUB_EVENT_NAME" --ref-type "$GITHUB_REF_TYPE" \
            | tee "$RUNNER_TEMP/release-stage.json"
      - name: Fast-forward the exact reviewed baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh auth setup-git
          expected="$(jq -er '.baseline_commit' "$RUNNER_TEMP/release-stage.json")"
          remote="$(git -C site ls-remote --exit-code origin refs/heads/gh-pages | cut -f1)"
          test "$remote" = "$expected" || { echo "gh-pages changed; prepare a fresh release." >&2; exit 1; }
          git -C site config user.name DennySORA
          git -C site config user.email dennysora.main@gmail.com
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "chore(pages): deploy reviewed release" \
              -m "What: Publish the hash-validated reviewed data and verified site shell." \
              -m "Why: Publish release source ${SOURCE_COMMIT}." \
              -m "Tests: Prepared payload, baseline, bilingual fields and local frontend gates passed."
            git -C site push origin HEAD:refs/heads/gh-pages
          else
            echo "Prepared data and shell are already published; no commit needed."
          fi
          printf 'PAGES_COMMIT=%s\n' "$(git -C site rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Request and verify the Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A GITHUB_TOKEN push does not itself trigger a Pages build.
          gh api --method POST "repos/${REPOSITORY}/pages/builds" --silent
          build_url="repos/${REPOSITORY}/pages/builds/latest"
          for attempt in $(seq 1 40); do
            result="$(gh api "$build_url")"
            status="$(jq -r .status <<< "$result")"
            commit="$(jq -r .commit <<< "$result")"
            # The latest endpoint may briefly still show the preceding build.
            current="$(gh api "repos/${REPOSITORY}/git/ref/heads/gh-pages" --jq .object.sha)"
            test "$current" = "$PAGES_COMMIT" || { echo "Another publication superseded this commit." >&2; exit 1; }
            if test "$commit" = "$PAGES_COMMIT"; then
              if test "$status" = built; then
                echo "Pages published $PAGES_COMMIT"
                exit 0
              fi
              test "$status" != errored || { echo "$result" >&2; exit 1; }
            fi
            sleep 15
          done
          echo "Pages did not finish within ten minutes." >&2
          exit 1
